<!DOCTYPE html>
<html>
<head>
<title>For Romil ❤️</title>

<style>
body {
  background: black;
  color: #ff4d6d;
  text-align: center;
  font-family: monospace;
  padding-top: 100px;
  overflow: hidden;
}

h1 {
  font-size: 32px;
}

p {
  font-size: 18px;
  color: white;
}

button {
  padding: 12px 25px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  margin: 15px;
  cursor: pointer;
}

#yes {
  background-color: #ff4d6d;
  color: white;
}

#no {
  background-color: grey;
  color: white;
  position: absolute;
}
</style>

</head>
<body>

<h1>Romil ❤️</h1>
<p>Initializing Love Protocol...</p>
<p>Searching for soulmate...</p>
<p>Soulmate Found: Romil 💘</p>
<p>Status: Permanently Locked 🔐</p>

<h2>Will you be my Valentine? 💍</h2>

<button id="yes" onclick="yesClicked()">YES 💘</button>
<button id="no" onmouseover="moveNo()">NO 🙈</button>

<script>
function yesClicked() {
  document.body.innerHTML = "<h1>I knew it 😌❤️</h1><p>Forever yours, Payal 💍</p>";
}

function moveNo() {
  var x = Math.random() * window.innerWidth;
  var y = Math.random() * window.innerHeight;
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}
</script>

</body>
</html>
